name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conduit-build:
    name: conduit code build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conduit-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ConduitBackend.slnx
      - run: dotnet build ConduitBackend.slnx -c Release --no-restore

  conduit-test:
    name: conduit code tests
    runs-on: ubuntu-latest
    needs: [conduit-build]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: conduit-backend
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Dev_Pass123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dev_Pass123 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: sqlserver://sa:Dev_Pass123@localhost:1433/master?trustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Conduit.UnitTests -c Release
      - run: dotnet test tests/Conduit.ArchitectureTests -c Release
      - run: dotnet test tests/Conduit.IntegrationTests -c Release

  conduit-docker:
    name: conduit docker container
    runs-on: ubuntu-latest
    needs: [conduit-test]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare environment
        run: make docker/env
      - name: Start stack
        run: make docker/up
      - name: Check health endpoint
        run: curl -fsS http://localhost:8080/health
      - name: Check API
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/users \
            -H 'Content-Type: application/json' \
            -d '{"user":{"username":"ci_user","email":"ci_user@mail.com","password":"CiPassword123"}}'
          curl -fsS http://localhost:8080/api/v1/tags
      - name: Check seed
        run: make docker/seed
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.local.yml ps -a
          docker inspect --format '{{json .State.Health}}' conduit-backend
          echo "=== backend logs"
          docker logs conduit-backend 2>&1 | tail -n 100
          echo "=== mssql logs"
          docker logs conduit-mssql 2>&1 | tail -n 30
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
