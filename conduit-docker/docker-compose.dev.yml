services:
  conduit-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: conduit-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Dev_Pass123
      DB_NAME: conduit_dev
    ports:
      - "1433:1433"
    volumes:
      - conduit-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"IF DB_ID(N'$${DB_NAME}') IS NULL CREATE DATABASE [$${DB_NAME}]\""]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  conduit-mssql-data:
