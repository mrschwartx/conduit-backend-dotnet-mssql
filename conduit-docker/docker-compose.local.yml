services:
  conduit-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: conduit-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, run make docker/env}
      DB_NAME: ${DB_NAME:-conduit}
    volumes:
      - conduit-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"IF DB_ID(N'$${DB_NAME}') IS NULL CREATE DATABASE [$${DB_NAME}]\""]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  conduit-backend:
    build:
      context: ../conduit-backend
      dockerfile: ../conduit-docker/conduit-backend-dotnet/Dockerfile
    image: conduit-backend:local
    container_name: conduit-backend
    restart: unless-stopped
    environment:
      APP_LEVEL: ${APP_LEVEL:-development}
      DATABASE_URL: sqlserver://sa:${DB_PASSWORD}@conduit-mssql:1433/${DB_NAME:-conduit}?trustServerCertificate=true
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required, run make docker/env}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      conduit-mssql:
        condition: service_healthy

volumes:
  conduit-mssql-data:
